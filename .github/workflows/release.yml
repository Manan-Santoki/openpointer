name: Release

# Merging to main with a new <Version> in src/OpenPointer/OpenPointer.csproj publishes that
# version. Pushing a tag like v0.3.0 also works:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  INNO_VERSION: 6.7.3

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/OpenPointer/OpenPointer.csproj)
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Version must look like 1.2.3, got '$version'"; exit 1; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # On main, publish only a version that has no release yet.
          if [ "$GITHUB_REF_TYPE" != tag ] && gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: '"value=${{ needs.version.outputs.value }}" >> $env:GITHUB_OUTPUT'

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: ./.github/scripts/release-notes.ps1 -Version "${{ steps.version.outputs.value }}" -OutFile "$env:RUNNER_TEMP/notes.md"

      - name: Test
        run: dotnet test tests/OpenPointer.Tests -c Release

      - name: Publish
        run: >
          dotnet publish src/OpenPointer -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/publish

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: |
          $tag = "is-" + $env:INNO_VERSION.Replace('.', '_')
          $installer = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION.exe" -OutFile $installer
          Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$env:RUNNER_TEMP\inno" -Wait
          "$env:RUNNER_TEMP\inno" >> $env:GITHUB_PATH

      - name: Build installer
        run: ISCC.exe /Q /DAppVersion=${{ steps.version.outputs.value }} installer\OpenPointer.iss

      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/OpenPointer-$v-portable.zip"
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Name -like "OpenPointer-*" }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -Path artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          gh release create "v$v" --target "${{ github.sha }}" `
            "artifacts/OpenPointer-Setup-$v.exe" `
            "artifacts/OpenPointer-$v-portable.zip" `
            "artifacts/SHA256SUMS.txt" `
            --title "OpenPointer $v" --notes-file "$env:RUNNER_TEMP/notes.md"
